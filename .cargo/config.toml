[env]
# ts-rs writes the TypeScript the web app uses here when `cargo test` runs. The files are committed; CI fails if a
# build leaves them changed.
TS_RS_EXPORT_DIR = { value = "web/src/types", relative = true }
# IDs and counts are i64 in Rust and plain JSON numbers on the wire, so the TypeScript says number, not bigint.
TS_RS_LARGE_INT = "number"

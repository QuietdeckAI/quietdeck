[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/QuietdeckAI/quietdeck"
rust-version = "1.99"

[workspace.dependencies]
quietdeck-types = { path = "crates/quietdeck-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
jiff = { version = "1.0.2", features = ["serde"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
schemars = "1.2.3"
garde = { version = "0.23.0", features = ["derive", "email", "url"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

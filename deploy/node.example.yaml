# node.yaml: a node's config, at ~/.config/quietdeck/node.yaml. `quietdeck node enroll` writes the first version.
# It holds references only: every token is in a file or an environment variable, filled by your secrets manager.

node:
  name: laptop                                  # this machine's name on the deck
  deck: https://quietdeck.example.com           # the deck's URL (QUIETDECK_PUBLIC_URL)
  token_file: ~/.config/quietdeck/node-token    # mode 600; or token_env: QUIETDECK_NODE_TOKEN

# Session summaries (headless Claude Code on this machine). Every key is optional; these are the defaults.
summaries:
  enabled: true
  idle_seconds: 60          # summarise a session once it has been idle this long
  min_gap_seconds: 1800     # at most one summary per session in this window
  max_concurrent: 2         # summary calls at once on this machine
  model: sonnet
  user_name: ""             # your name, for the prompts ("since Sam's last message"); empty means "the user"

# Account usage for this machine's Claude Code and Codex sign-ins. No token leaves the machine.
usage:
  enabled: true
  poll_minutes: 5
  codex: true
  serve_coordinator_api: true   # keeps the account rotator's plugin working

# Sessions the deck starts or resumes here. Permission flags come only from this file, never from the deck.
sessions:
  claude_args: []                 # e.g. [--dangerously-skip-permissions]
  codex_args: [--no-daemon]

# Programs the node runs, if they aren't on PATH under these names.
programs:
  herdr: herdr
  claude: claude
  codex: codex

# The runner: only on the machine where the triage agent runs. It watches Gmail's history (message IDs and labels
# only) and wakes the agent when mail arrives, and it carries out approved actions that need no thought. Every tool
# is an Executor app tool (`path`) or a command that reads JSON on stdin and prints JSON (`command`). In `input`,
# ${...} names a value: account.address, account.<var>, action.<field>, card.<field>, board.<field>, and for the mail
# watch history_id and page_token. See docs/executor.md.
runner:
  enabled: false
  agent: { tab: email triage }                  # gets wake-ups, hand-offs and error reports
  executor:
    url: https://executor.example.com/org/<org>/mcp
    token_file: ~/.config/quietdeck/executor-token   # mode 600; or token_env: QUIETDECK_EXECUTOR_TOKEN
  accounts:                                     # the account IDs from the deck's config
    personal:
      address: you@example.com
      label: Personal
      vars: { executor_account: acc_<id> }      # Executor's ID for this Google account
  mail_watch:
    every: 30s
    profile: { path: tools.google.api.gmail.users.gmailUsersGetProfile, input: { accountId: "${account.executor_account}", input: { path: { userId: me } } } }
    history:
      path: tools.google.api.gmail.users.gmailUsersHistoryList
      input:
        accountId: "${account.executor_account}"
        input:
          path: { userId: me }
          query: { startHistoryId: "${history_id}", pageToken: "${page_token}", historyTypes: [messageAdded], fields: "history(messagesAdded(message(id,labelIds))),historyId,nextPageToken" }
  thread:
    path: tools.google.api.gmail.users.gmailUsersThreadsGet
    input: { accountId: "${account.executor_account}", input: { path: { userId: me, id: "${action.thread_id}" }, query: { format: minimal, fields: "id,messages(id,labelIds)" } } }
  send_as:
    path: tools.google.api.gmail.users.gmailUsersSettingsSendAsList
    input: { accountId: "${account.executor_account}", input: { path: { userId: me }, query: { fields: "sendAs(sendAsEmail)" } } }
  labels:                                       # lists an account's labels; a label that doesn't exist yet goes to the agent
    path: tools.google.api.gmail.users.gmailUsersLabelsList
    input: { accountId: "${account.executor_account}", input: { path: { userId: me }, query: { fields: "labels(id,name)" } } }
  gmail_filters:                                # gmail-filter leases; without this, each holder makes its own filter
    create_label: { path: tools.google.api.gmail.users.gmailUsersLabelsCreate, input: { accountId: "${account.executor_account}", input: { path: { userId: me }, body: { name: "${lease.label}" } } } }
    create:
      path: tools.google.api.gmail.users.gmailUsersSettingsFiltersCreate
      input: { accountId: "${account.executor_account}", input: { path: { userId: me }, body: { criteria: { query: "${lease.query}" }, action: { addLabelIds: ["${lease.label_id}"], removeLabelIds: [INBOX, UNREAD] } } } }
    delete: { path: tools.google.api.gmail.users.gmailUsersSettingsFiltersDelete, input: { accountId: "${account.executor_account}", input: { path: { userId: me, id: "${lease.filter_id}" } } } }
    inbox: { path: tools.google.api.gmail.users.gmailUsersThreadsList, input: { accountId: "${account.executor_account}", input: { path: { userId: me }, query: { q: "${lease.query} in:inbox", maxResults: 100, fields: "threads(id)" } } } }
    move: { path: tools.google.gmail.modify, input: { account: "${account.address}", threadIds: "${thread_ids}", addLabels: ["${lease.label}"], archive: true, read: true } }
  boards:                                       # the board names from the deck's config, with the tracker's IDs
    engineering: { workflow_state_id: 500000001 }
  eligible: [archive, mark_read, label, draft, forward, watch, lease, story, task, calendar, resume, new_session]
  tools:
    archive:   { path: tools.google.gmail.modify, input: { account: "${account.address}", threadIds: ["${action.thread_id}"], archive: true } }
    mark_read: { path: tools.google.gmail.modify, input: { account: "${account.address}", threadIds: ["${action.thread_id}"], read: true } }
    label:     { path: tools.google.gmail.modify, input: { account: "${account.address}", threadIds: ["${action.thread_id}"], addLabels: "${action.add}", removeLabels: "${action.remove}" } }
    draft:     { path: tools.google.gmail.draft, input: { account: "${account.address}", from: "${action.from}", to: "${action.to}", cc: "${action.cc}", subject: "${action.subject}", body: "${action.body}", replyToMessageId: "${action.reply_to_message_id}" } }
    calendar:  { path: tools.google.calendar.createEvent, input: { account: "${account.address}", calendarId: "${action.calendar}", summary: "${action.title}", start: "${action.start}", end: "${action.end}", timeZone: "${action.time_zone}", location: "${action.location}", description: "${action.description}" } }
    story.create:                               # stories and tasks: one tool per op (story.comment, task.create, task.update, task.done)
      path: tools.shortcut.stories.createStory
      input: { accountId: acc_<shortcut account>, input: { body: { name: "${action.title}", description: "${action.description}", story_type: "${action.story_type}", workflow_state_id: "${board.workflow_state_id}" } } }

# The Matrix reader: only on the machine that holds the Matrix user's password. It syncs these rooms and hands each
# new message to the deck, which tells the runner; the agent reads them with `quietdeck messages --new` and never
# holds a Matrix token. The device, its token and its crypto store stay in `store` (mode 700, default
# ~/.local/state/quietdeck/matrix). The first sign-in starts from now. `quietdeck-node matrix-check` tries it out
# (stop the node first).
matrix:
  homeserver: https://matrix.example.com
  user: '@quietdeck:example.com'                # already a member of each room
  password_file: ~/.config/quietdeck/matrix-password   # mode 600, the password only
  rooms: ['!abc123:example.com']                # room IDs, not aliases

[package]
name = "quietdeck-server"
description = "Quietdeck's deck: the REST API, MCP endpoint, node WebSocket, webhook receiver and web app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "quietdeck-server"
path = "src/main.rs"

[dependencies]
# Pinned exactly: only the 0.16 alphas build on axum 0.8 and schemars 1. It reads each handler's types to write the
# OpenAPI spec (src/openapi.rs).
aide = { version = "=0.16.0-alpha.4", features = ["axum", "axum-json", "axum-query", "axum-ws"] }
indexmap = "2"
webauthn-rs = "0.6.2"
# Signing the owner in through Fleetlayer's sign-in service (OpenID Connect with PKCE). Fleetlayer's own client, the
# one pages and its Claude sign-in hub use; same licence as Quietdeck (FSL-1.1-ALv2).
fleetlayer-oidc = { git = "https://github.com/fleetlayer/fleetlayer", tag = "v0.3.13" }
quietdeck-types.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
garde.workspace = true
schemars.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.7.1", features = ["trace"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
rust-embed = "8.14.0"
clap = { version = "4.6.9", features = ["derive", "env"] }
yaml_serde = "0.10.7"
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
base64 = "0.22"
rand = "0.9"
hex = "0.4"
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
p256 = "0.13.2"
web-push-native = "0.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
http = "1"
mime_guess = "2"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The sign-in tests' issuer signs ID tokens with a test-only key (tests-data/). fleetlayer-oidc's own fake issuer needs
# rsa 0.10, which can't sit beside webauthn-rs's 0.10 release candidate.
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }

[lints]
workspace = true

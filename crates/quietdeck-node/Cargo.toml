[package]
name = "quietdeck-node"
description = "Quietdeck's node daemon: herdr automation, summaries, transcripts, delivery and the runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "quietdeck-node"
path = "src/main.rs"

[dependencies]
quietdeck-types.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
jiff.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1.92"
futures = "0.3.34"
axum = "0.8.9"
sha2 = "0.11.1"
hex = "0.4.3"
unicode-normalization = "0.1.26"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
nix = { version = "0.32.0", default-features = false, features = ["signal", "hostname"] }
form_urlencoded = "1.2.3"
regex = "1.13.2"
rand = "0.9"
anyhow = "1"
yaml_serde = "0.10.7"
clap = { version = "4.6.9", features = ["derive", "env"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
memchr = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

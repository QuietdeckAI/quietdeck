[package]
name = "quietdeck-cli"
description = "The quietdeck command: agents' and people's way into the deck"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "quietdeck"
path = "src/main.rs"

[dependencies]
quietdeck-types.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tokio.workspace = true
anyhow = "1"
clap = { version = "4.6.9", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

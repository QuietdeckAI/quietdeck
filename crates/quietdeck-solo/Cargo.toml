[package]
name = "quietdeck-solo"
description = "Quietdeck solo: the deck and one node with its runner and agent in one process, on the person's own machine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "quietdeck-solo"
path = "src/main.rs"

[dependencies]
quietdeck-server = { path = "../quietdeck-server" }
quietdeck-node = { path = "../quietdeck-node" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
tracing.workspace = true
anyhow = "1"
clap = { version = "4.6.9", features = ["derive", "env"] }
yaml_serde = "0.10.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

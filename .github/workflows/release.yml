# On a version tag (v0.1.0), build quietdeck-solo and the quietdeck CLI for Linux and macOS, attest where each came
# from, and publish them with SHA-256 checksums as a GitHub release, for install.sh
# (`curl -fsSL https://quietdeck.ai/install.sh | sh`).
# Adapted from Fleetlayer's release.yml (Apache 2.0, see NOTICE): Quietdeck's binaries, and the web app built first,
# since a release build embeds it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The Inbox is embedded in quietdeck-solo at build time: without web/dist it would serve "no web app".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      - name: Check the web app is there to embed
        run: test -f web/dist/index.html
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p quietdeck-solo -p quietdeck-cli
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name=quietdeck-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "dist/$name"
          for b in quietdeck-solo quietdeck; do
            cp "target/${{ matrix.target }}/release/$b" "dist/$name/"
          done
          cp LICENSE.md README.md "dist/$name/"
          cp NOTICE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a "-" (v0.1.0-rc.1) is a prerelease, for testing: /releases/latest skips it, so install.sh never
        # picks it up unless asked (QUIETDECK_VERSION=v0.1.0-rc.1).
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre
